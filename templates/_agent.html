<div id="ag" class="ag" data-page="{{ request.endpoint }}">
    <section class="ag-panel" id="ag-panel" hidden role="dialog" aria-label="Trợ lý HUSTBot">
        <header class="ag-h">
            <div class="ag-ht">
                <span class="ag-ic"><span class="icon">neurology</span></span>
                <div><b>HUSTBot</b><small><span class="sd ok"></span>Đang theo dõi trang này</small></div>
            </div>
            <div class="ag-ha">
                <button class="ibtn" id="ag-clear" title="Cuộc trò chuyện mới"><span
                        class="icon">restart_alt</span></button>
                <button class="ibtn" id="ag-close" title="Đóng (Esc)"><span class="icon">close</span></button>
            </div>
        </header>
        <div class="ag-log" id="ag-log" aria-live="polite"></div>
        <div class="ag-chips" id="ag-chips"></div>
        <div class="ag-in">
            <textarea id="ag-q" rows="1" placeholder="Hỏi hoặc nhờ HUSTBot làm gì đó..."></textarea>
            <button class="ag-send" id="ag-send" title="Gửi"><span class="icon">send</span></button>
        </div>
    </section>
    <button class="ag-fab" id="ag-fab" aria-label="Mở trợ lý HUSTBot" aria-expanded="false" title="Trợ lý (Ctrl+K)">
        <span class="icon">neurology</span>
    </button>
</div>
