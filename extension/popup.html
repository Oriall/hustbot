<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>
  :root {
    --bg: #0e1218;
    --s1: #161a21;
    --s2: #1d222b;
    --s3: #272d38;
    --line: rgba(255, 180, 171, .16);
    --tx: #e6e8ec;
    --mut: #9aa3b0;
    --red: #ba141a;
    --pri: #ffb4ab;
    --ok: #4edea3;
    --warn: #f5c451;
  }

  * { box-sizing: border-box }

  body {
    width: 348px;
    margin: 0;
    padding: 12px;
    background: var(--bg);
    color: var(--tx);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* ---------- Header ---------- */
  .top { display: flex; align-items: center; gap: 10px; padding: 2px 2px 12px }
  .top img { width: 34px; height: 34px; border-radius: 9px; background: var(--s2) }
  .top b { display: block; font-size: 15px; letter-spacing: -.01em }
  .top span { color: var(--mut); font-size: 11.5px }

  /* ---------- Thẻ ---------- */
  .card { background: var(--s1); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px }
  .h { display: flex; align-items: center; justify-content: space-between; margin: 0 0 8px;
       font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mut) }
  .h em { font-style: normal; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 11px }

  label { display: block; margin: 8px 0 4px; font-size: 12px; color: var(--mut) }
  label:first-of-type { margin-top: 0 }
  label em { font-style: normal; color: var(--pri) }

  input {
    width: 100%;
    background: var(--s2);
    color: var(--tx);
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
    transition: border-color .15s, background .15s;
  }
  input::placeholder { color: #6b7380 }
  input:focus { outline: 0; border-color: var(--red); background: var(--s3) }

  .field { position: relative }
  .field input { padding-right: 38px }
  .ico {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 30px; height: 30px; display: grid; place-items: center;
    background: none; border: 0; border-radius: 6px; color: var(--mut); cursor: pointer;
  }
  .ico:hover { color: var(--tx); background: var(--s3) }

  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8;
        stroke-linecap: round; stroke-linejoin: round; flex: none }
  .ico svg { width: 16px; height: 16px }

  /* ---------- Nút hành động ---------- */
  .act {
    display: flex; align-items: center; gap: 10px;
    width: 100%; margin: 0 0 8px; padding: 10px 12px;
    background: var(--s2); color: var(--tx);
    border: 1px solid transparent; border-radius: 10px;
    font: inherit; text-align: left; cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .act:last-of-type { margin-bottom: 0 }
  .act:hover { background: var(--s3); border-color: var(--line) }
  .act:active { transform: scale(.985) }
  .act:focus-visible, .ico:focus-visible, summary:focus-visible { outline: 2px solid var(--pri); outline-offset: 2px }
  .act .ic { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px;
             background: rgba(186, 20, 26, .2); color: var(--pri) }
  .act .tt { flex: 1; min-width: 0 }
  .act .tt b { display: block; font-weight: 600 }
  .act .tt small { display: block; margin-top: 1px; color: var(--mut); font-size: 11.5px; line-height: 15px }
  .act .go { color: var(--mut) }
  .act.primary { background: var(--red); }
  .act.primary:hover { background: #cf1a21 }
  .act.primary .ic { background: rgba(255, 255, 255, .18); color: #fff }
  .act.primary .tt small, .act.primary .go { color: rgba(255, 255, 255, .78) }

  body.busy .act { pointer-events: none; opacity: .55 }

  /* ---------- Nâng cao ---------- */
  details { margin-top: 10px; border-top: 1px solid var(--s3); padding-top: 8px }
  summary { cursor: pointer; color: var(--mut); font-size: 12px; list-style: none; display: flex; align-items: center; gap: 6px }
  summary::-webkit-details-marker { display: none }
  summary::before { content: "▸"; font-size: 10px; transition: transform .15s }
  details[open] summary::before { transform: rotate(90deg) }
  details small { display: block; margin-top: 6px; color: var(--mut); font-size: 11.5px; line-height: 15px }
  details label { margin-top: 8px }

  /* ---------- Trạng thái ---------- */
  #msg {
    margin: 0 0 10px; padding: 9px 12px;
    background: var(--s1); border: 1px solid var(--line); border-left: 3px solid var(--mut);
    border-radius: 10px;
    white-space: pre-line; font-size: 12px; line-height: 17px;
    word-break: break-word;
  }
  #msg:empty { display: none }
  #msg.ok   { border-left-color: var(--ok);   background: rgba(0, 107, 73, .16) }
  #msg.err  { border-left-color: var(--red);  background: rgba(186, 20, 26, .14) }
  #msg.warn { border-left-color: var(--warn); background: rgba(245, 196, 81, .1) }
  #msg.busy { border-left-color: var(--pri); animation: pulse 1.4s ease-in-out infinite }
  @keyframes pulse { 50% { opacity: .6 } }

  .foot { display: flex; gap: 8px; color: var(--mut); font-size: 11px; line-height: 15px; padding: 0 2px }
  .foot svg { width: 14px; height: 14px; margin-top: 1px }
  .foot b { color: var(--tx); font-weight: 600 }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
</style>

<header class="top">
  <img src="icons/icon2.png" alt="">
  <div>
    <b>HUSTBot Connect</b>
    <span>Đồng bộ dữ liệu từ cổng trường vào HUSTBot</span>
  </div>
</header>

<!-- KẾT NỐI -->
<section class="card">
  <div class="h">Kết nối</div>
  <label for="server">Địa chỉ HUSTBot</label>
  <input id="server" placeholder="Địa chỉ HUSTBot, vd http://localhost:5000" autocomplete="off" spellcheck="false">
  <label for="token">Mã ghép nối <em>• hiệu lực 10 phút</em></label>
  <div class="field">
    <input id="token" type="password" placeholder="Mã ghép nối (tạo trên web HUSTBot)" autocomplete="off" spellcheck="false">
    <button class="ico" id="tokToggle" type="button" title="Hiện / ẩn mã" aria-label="Hiện hoặc ẩn mã ghép nối">
      <svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></svg>
    </button>
  </div>
</section>

<!-- ĐỒNG BỘ -->
<section class="card">
  <div class="h">Đồng bộ dữ liệu</div>

  <button class="act primary" id="send" type="button">
    <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" /></svg></span>
    <span class="tt"><b>Gửi thời khóa biểu tuần này</b>
      <small>qldt.hust.edu.vn → Thời khoá biểu → tab Lịch</small></span>
    <svg class="go" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
  </button>

  <button class="act" id="sendProgram" type="button">
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z" /><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5" /></svg></span>
    <span class="tt"><b>Gửi chương trình đào tạo</b>
      <small>Mở tab ctt-sis.hust.edu.vn, bung các nhóm học phần</small></span>
    <svg class="go" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
  </button>

  <button class="act" id="sendAwards" type="button">
    <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6" /><path d="M8.5 14L7 22l5-3 5 3-1.5-8" /></svg></span>
    <span class="tt"><b>Gửi học bổng</b>
      <small>Mở tab qldt hoặc student.hust.edu.vn (đã đăng nhập)</small></span>
    <svg class="go" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
  </button>

  <details id="adv">
    <summary>Nâng cao</summary>
    <label for="uid">userIds (học bổng)</label>
    <input id="uid" placeholder="userIds (để trống: tự tìm trên trang)" inputmode="numeric" autocomplete="off">
    <small>Chỉ cần nhập khi extension không tự tìm được. F12 → Network → request <b>awards</b> → số sau <b>userIds=</b>.</small>
  </details>
</section>

<div id="msg" role="status" aria-live="polite"></div>

<div class="foot">
  <svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z" /></svg>
  <span>Extension chỉ chạy khi bạn bấm và chỉ đọc chữ trên trang đang mở. <b>Không lấy token hay cookie</b> của trường.</span>
</div>

<script src="popup.js"></script>
</html>
